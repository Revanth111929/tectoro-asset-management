# Logrotate configuration for Tectoro IT Asset Management
#
# Installation:
#   sudo cp logrotate.conf /etc/logrotate.d/asset-management
#   sudo chmod 644 /etc/logrotate.d/asset-management
#   sudo chown root:root /etc/logrotate.d/asset-management
#
# Test rotation:
#   sudo logrotate -f /etc/logrotate.d/asset-management
#
# Verify:
#   ls -lh /home/administrator/Desktop/asset-management/logs/

/home/administrator/Desktop/asset-management/logs/*.log {
    # Specify user and group for rotation (required when directory has group write)
    su administrator administrator

    # Rotate logs daily
    daily

    # Keep 30 days of logs
    rotate 30

    # Compress old logs to save disk space
    compress

    # Delay compression until next rotation (allows recent logs to be readable)
    delaycompress

    # Don't error if log file is missing
    missingok

    # Don't rotate if log is empty
    notifempty

    # Create new log file after rotation with these permissions
    create 0664 administrator administrator

    # Use date as suffix for rotated files (YYYYMMDD)
    dateext

    # Date format: YYYYMMDD
    dateformat -%Y%m%d

    # Use copytruncate to avoid issues with open file handles
    # This copies the log file and truncates the original
    # Safer for running applications that keep file handles open
    copytruncate

    # Set maximum size - rotate if log exceeds 100MB even if not daily
    maxsize 100M

    # Execute after rotation (optional - can reload/restart services)
    postrotate
        # Optionally send HUP signal to gunicorn to reopen log files
        # Commented out because copytruncate handles this automatically
        # pkill -HUP gunicorn || true
    endscript
}
